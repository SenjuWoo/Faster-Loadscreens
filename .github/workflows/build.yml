name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fallout4:
    name: Build Fallout 4 (Release)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve vcpkg
        shell: pwsh
        run: |
          $root = $env:VCPKG_ROOT
          if (-not $root) { $root = $env:VCPKG_INSTALLATION_ROOT }
          if (-not $root) { $root = "C:\vcpkg" }
          if (-not (Test-Path (Join-Path $root "scripts/buildsystems/vcpkg.cmake"))) {
            throw "Could not locate vcpkg under $root"
          }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fetch CommonLibF4
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/alandtse/CommonLibF4.git "$env:RUNNER_TEMP/CommonLibF4"
          if (-not (Test-Path "$env:RUNNER_TEMP/CommonLibF4/CMakeLists.txt")) {
            throw "CommonLibF4 clone missing CMakeLists.txt"
          }

      - name: Configure
        working-directory: fallout
        shell: pwsh
        run: >
          cmake -S . -B build
          -D CMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -D COMMONLIBF4_PATH="$env:RUNNER_TEMP/CommonLibF4"

      - name: Build
        working-directory: fallout
        run: cmake --build build --config Release --parallel
